<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>높은뜻안성교회 회의록</title>
<!-- 아이콘·매니페스트: 브라우저 메뉴로 「홈 화면에 추가」할 때 이름·아이콘에 쓰임 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d5d8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="회의록">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#f6f5f2;--card:#fff;--ink:#1e1e1c;--muted:#6b6a66;--line:#e3e1dc;
    --accent:#2d5d8f;--accent-soft:#e6eef7;--danger:#b4432f;--ok:#2f7a4b;--warn:#a06b11;
    --r:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;flex:1}
  header .ver{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  header button{background:none;border:0;color:var(--accent);font-size:14px;padding:6px 8px;cursor:pointer}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:14px;margin:18px 0 6px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=date],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--danger);border-color:#e8c9c3}
  .btn.block{width:100%}
  .btn:disabled{opacity:.5;cursor:default}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .list-item{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;cursor:pointer}
  .list-item .t{font-weight:600;font-size:15px}
  .list-item .m{font-size:13px;color:var(--muted);margin-top:2px}
  .list-item .s{font-size:14px;margin-top:6px}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;padding:2px 8px;border-radius:999px;margin:2px 4px 0 0}
  .tag.warn{background:#fbf1dd;color:var(--warn)}
  .tag.ok{background:#e4f2e8;color:var(--ok)}
  /* 회의록 문서 보기(샘플 양식: 제목 → 소개 → 1.개인별 발언 표 → 2.주제별 → 3.종합 제안 표 → 4.확인 필요) */
  .doc-title{text-align:center;color:var(--accent);font-size:22px;margin:4px 0 4px}
  .doc-sub{text-align:center;color:var(--muted);font-size:14px}
  .doc-intro{border-top:1px solid var(--line);margin:14px 0 0;padding-top:12px;font-size:14px;color:#444}
  .sec-t{color:var(--accent);font-size:17px;margin:0 0 10px}
  .tb{width:100%;border-collapse:collapse;font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tb th,.tb td{border:1px solid #9a9a9a;padding:8px 10px;vertical-align:top;text-align:left}
  .tb th{background:#dce6f1;font-weight:700}
  .tb td{white-space:pre-wrap}
  .tb td.k{background:#f3f2ee;font-weight:700;white-space:nowrap}
  .tb td.n{text-align:center;font-weight:700;width:44px}
  .topic{color:#3a74b0;font-size:15px;margin:14px 0 4px;font-weight:700}
  .bul{margin:0;padding-left:20px}
  .bul li{margin:4px 0;white-space:pre-wrap}
  .sec-label{display:inline-block;color:var(--accent);background:var(--accent-soft);border-left:4px solid var(--accent);padding:4px 10px;border-radius:6px;font-size:14px;font-weight:700;margin:18px 0 8px}
  .edit-list .pair{display:grid;grid-template-columns:110px 1fr 36px;gap:6px;margin-bottom:6px}
  .edit-list .pair input{min-width:0}
  .topic-edit{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fafaf8}
  .topic-edit .item{margin-bottom:4px}
  .topic-edit textarea{width:100%;min-height:80px}
  .items{list-style:none;padding:0;margin:0}
  .items li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
  .items li:last-child{border-bottom:0}
  .items li .txt{flex:1;white-space:pre-wrap}
  .edit-list .item{display:flex;gap:6px;margin-bottom:6px}
  .edit-list textarea{min-height:44px;flex:1}
  .edit-list .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;cursor:pointer;color:var(--muted)}
  .add{background:none;border:1px dashed var(--line);border-radius:8px;width:100%;padding:8px;color:var(--muted);cursor:pointer;font:inherit}
  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
  .thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafaf8}
  .thumb img{width:100%;height:110px;object-fit:cover;display:block}
  .thumb .k{position:absolute;left:6px;top:6px;font-size:11px;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
  .thumb .x{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:999px;width:22px;height:22px;cursor:pointer}
  .thumb .file{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:26px 8px 28px;text-align:center;font-size:12px;color:var(--muted);word-break:break-all;text-decoration:none}
  .thumb .file b{font-size:20px;color:var(--accent)}
  .thumb select{position:absolute;left:0;right:0;bottom:0;border:0;border-radius:0;font-size:12px;padding:4px;background:rgba(255,255,255,.95)}
  .overlay{position:fixed;inset:0;background:rgba(246,245,242,.85);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:12px;text-align:center;padding:20px}
  .overlay.on{display:flex}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:25;padding:16px}
  .modal .card{width:100%;max-width:380px;margin:0}
  .modal label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:0;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .modal label.chk input{width:18px;height:18px}
  .tb td ul.bul{padding-left:16px}
  /* v2.4: Word에 넣을 항목 체크 (화면에서만, 인쇄 땐 숨김) */
  input.xs,input.xsec{width:17px;height:17px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--accent);cursor:pointer;flex:none}
  .xi.off{opacity:.38}
  .xbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-bottom:12px}
  .xbar button{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0 4px}
  ul.ckl{list-style:none;padding-left:0}
  ul.ckl>li{display:flex;align-items:flex-start}
  .tb td.k label{display:flex;align-items:flex-start}
  .tb td ul.bul li{margin:2px 0}
  .spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90vw}
  .toast.on{opacity:1}
  .search{display:flex;gap:8px;margin-bottom:12px}
  /* v3.1: 부서 고르기 · 비공개 */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip small{opacity:.7;margin-left:3px}
  .tag.dept{background:#ece7f6;color:#5a3f8f}
  .tag.lock{background:#f1e9e7;color:var(--danger)}
  .list-item.locked .t{color:var(--muted)}
  .list-item .no{display:inline-block;min-width:2.2em;margin-right:6px;color:var(--muted);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
  .dept-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .lock-hint{font-size:12px;color:var(--muted);margin:4px 0 0}
  .search input{flex:1}
  .related-cand{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
  .related-cand input{margin-top:4px}
  .meta-line{font-size:13px;color:var(--muted)}
  pre.raw{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--muted);background:#fafaf8;padding:10px;border-radius:8px;max-height:260px;overflow:auto}
  .hidden{display:none!important}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
  .link{color:var(--accent);text-decoration:none;cursor:pointer}
  @media (max-width:480px){.row{flex-direction:column;gap:0}.edit-list .pair{grid-template-columns:1fr 36px}.edit-list .pair textarea{grid-column:1/3}}
  /* v2.9: 인쇄/PDF는 Word와 같은 문서 모양(#printDoc)만 찍는다 */
  #printDoc{display:none}
  .pd{font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:10.5pt;line-height:1.6;color:#000}
  .pd h1{text-align:center;font-size:20pt;color:#2F5A8B;margin:10pt 0 4pt;font-weight:700}
  .pd .sub{text-align:center;font-size:10pt;color:#666;border-bottom:1px solid #bbb;padding-bottom:6pt;margin-bottom:10pt}
  .pd .intro{font-size:10pt;color:#444;margin:8pt 0 6pt;white-space:pre-line}
  .pd h2{font-size:14pt;color:#2F5A8B;margin:16pt 0 6pt;font-weight:700;break-after:avoid}
  .pd h3{font-size:12pt;color:#3A74B0;margin:10pt 0 4pt;font-weight:700;break-after:avoid}
  .pd h3 small{font-size:9pt;color:#888;font-weight:400}
  .pd ul{margin:0 0 4pt;padding-left:20pt}.pd li{margin:0 0 3pt}
  .pd table{width:100%;border-collapse:collapse;table-layout:fixed;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pd th,.pd td{border:1px solid #000;padding:3.5pt 5.5pt;vertical-align:top;text-align:left}
  .pd th{background:#DCE6F1;font-weight:700}.pd td.k{background:#F3F2EE;font-weight:700}
  .pd td ul{margin:0;padding-left:14pt}
  .pd thead{display:table-header-group}
  .pd .note{font-size:10pt;color:#444;margin:0 0 4pt}
  .pd .foot{text-align:right;font-size:9pt;color:#888;border-top:1px solid #bbb;padding-top:6pt;margin-top:18pt}
  @media print{
    @page{size:A4;margin:20mm}
    body.printing>*:not(#printDoc){display:none!important}
    body.printing #printDoc{display:block}
    body.printing{background:#fff}
    header,.actions,.toast,.overlay,details summary{display:none!important}
    body{background:#fff;font-size:12pt}
    main{max-width:none;padding:0}
    .card{border:0;padding:0 0 8px;break-inside:avoid-page}
    .tb tr{break-inside:avoid}
    .thumbs,input[type=checkbox]{display:none}
    details:not([open])>*:not(summary){display:none}
  }
</style>
</head>
<body>
<header>
  <h1><span id="hTitle">높은뜻안성교회 회의록</span><span class="ver" id="hVer"></span></h1>
  <button id="hBack" class="hidden" onclick="go('list')">목록</button>
  <button id="hLogout" class="hidden" onclick="logout()">로그아웃</button>
</header>
<main id="app"></main>
<div id="overlay" class="overlay"><div class="spinner"></div><div id="overlayMsg" class="muted">처리 중…</div></div>
<div id="toast" class="toast"></div>

<script>
/* ───────── 설정: Apps Script 웹앱 URL을 여기에 넣으세요 ───────── */
const API_URL = 'https://script.google.com/macros/s/AKfycbx1EqEWcLeOX4ldD4JSwbm1pwFsgwBJHx6p1ozx5k2ThRUKI4WU1C5IzkByVg9l1p3x/exec';

/* 앱 버전 — 고칠 때마다 올린다(상태.md 「현재 버전」과 같게) */
const APP_VERSION = 'v3.8';
document.getElementById('hVer').textContent = APP_VERSION;

/* ───────── 상태 ───────── */
const S = {
  token: localStorage.getItem('mm_token') || '',
  items: [],
  current: null,
  draft: null,       // 새 회의록 / 수정 중인 데이터
  images: [],        // {name,mime,data(base64),type,preview}
  view: 'list',
  pass: {},          // v3.1: 이번에 연 비공개 회의록 비밀번호(id→비밀번호). 메모리에만, 새로고침하면 다시 물음
};
// v3.1: 부서 (서버 Code.gs DEPTS와 같게)
const DEPTS=['공동의회','당회','제직회','목회협의회','이끄미','비타키즈','베리키즈','비아틴즈','비컨청년부','교역자','재정부'];
const deptOpts=sel=>`<option value="">부서 선택</option>`+DEPTS.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
// 부서 + 비밀번호 칸(새 회의록·확인·수정 화면 공용). 비밀번호를 넣으면 비공개, 비우면 공개
function deptRowHtml(pre,dept,pass){
  return `<div class="dept-row">
      <div><label>부서</label><select id="${pre}Dept">${deptOpts(dept)}</select></div>
      <div><label>비밀번호 <span style="font-weight:400">(선택)</span></label><input type="password" id="${pre}Pass" value="${esc(pass||'')}" autocomplete="new-password" placeholder="비우면 공개"></div>
    </div>
    <p class="lock-hint">🔒 비밀번호를 넣으면 비공개(열 때 비밀번호 필요, 목록엔 날짜·부서만 보임), 비우면 누구나 볼 수 있는 공개입니다.</p>`;
}
// 회의록 본문 4단 구성 (샘플 양식)
// v2.1: 5. 첨부 자료 내용(유인물 사진·PDF·PPT·문서를 AI가 요약) 추가 — 기존 1~4 번호는 그대로 둠
const SEC = { speakers:'1. 개인별 발언 정리', topics:'2. 주제별 정리', proposals:'3. 종합 제안', checks:'4. 확인이 필요한 사항', materials:'5. 첨부 자료 내용' };
const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const circ=i=>CIRC[i]||`(${i+1})`;
// 저장된 문서/AI 결과를 한 형태로 맞춤 (문자열만 들어온 옛 데이터도 받아줌)
function normDoc(d){
  d.speakers=(d.speakers||[]).map(x=>typeof x==='string'?{speaker:'',text:x}:{speaker:String(x.speaker||''),text:String(x.text||'')});
  d.topics=(d.topics||[]).map(x=>typeof x==='string'?{title:x,items:[]}:{title:String(x.title||''),items:(x.items||[]).map(v=>String(v??''))});
  d.proposals=(d.proposals||[]).map(x=>typeof x==='string'?{item:x,action:''}:{item:String(x.item||''),action:String(x.action||'')});
  d.checks=(d.checks||[]).map(v=>typeof v==='string'?v:String(v.text||''));
  d.materials=(d.materials||[]).map(x=>({title:String(x.title||''),source:String(x.source||''),items:(x.items||[]).map(v=>String(v??''))}));
  return d;
}
// keys: 넣을 본문 칸(없으면 내용 있는 칸 전부). Word 저장에서 칸을 뺄 수 있어서 소개 문장도 거기에 맞춘다
const secName=k=>SEC[k].replace(/^\d+\.\s*/,'');
function introText(d,keys){
  keys=keys||Object.keys(SEC).filter(k=>(d[k]||[]).length);
  const m=keys.includes('materials');
  return `본 문서는 ${fmtDate(d.date)} ${d.title||'회의'}의 녹음 채록문${m?'과 첨부 자료를':'을'} AI로 정리한 것입니다.`+(keys.length?` ${keys.map(secName).join(', ')}의 순서로 구성하였습니다.`:'');
}
// v2.2: 개인별 발언은 개조식(줄바꿈으로 구분). 예전 서술형(한 덩어리)도 그대로 받아줌
const spLines=t=>String(t||'').split(/\n+/).map(x=>x.replace(/^\s*[•\-·]\s*/,'').trim()).filter(Boolean);
const spCell=t=>{ const l=spLines(t); return l.length>1?`<ul class="bul">${l.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:esc(l[0]||''); };

/* ───────── 유틸 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function busy(on,msg){ $('#overlay').classList.toggle('on',!!on); $('#overlayMsg').textContent=msg||'처리 중…'; }
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); const w=['일','월','화','수','목','금','토'][new Date(s).getDay()]; return `${y}.${m}.${d}(${w})`; }

async function api(action, payload={}){
  if (API_URL.startsWith('PASTE_')) throw new Error('index.html 상단 API_URL에 Apps Script 웹앱 주소를 넣어주세요');
  const res = await fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // preflight 회피
    body: JSON.stringify(Object.assign({action, token:S.token}, payload))
  });
  const data = await res.json();
  if (!data.ok) {
    if (data.code === 'AUTH') { logout(false); throw new Error('다시 로그인해주세요'); }
    const err=new Error(data.error || '요청 실패'); err.code=data.code; throw err;
  }
  return data;
}

/* ───────── 라우팅 ───────── */
/* v3.4: 폰 「뒤로 가기」 — 방문 기록을 두 단으로만 쓴다: [목록] ← [그 밖의 화면 하나].
   목록에서 다른 화면으로 갈 때 한 칸 쌓고(pushState), 그 뒤 화면끼리는 바꿔치기(replaceState).
   그래서 상세·수정·새 회의록 어디서든 뒤로 가기 = 목록. 목록에서 뒤로 가기는 앱을 나감 */
const SUB_VIEWS=['new','review','detail','edit'];
function go(view, arg, fromPop){
  if(!fromPop){
    const inSub=!!(history.state&&history.state.sub);
    if(SUB_VIEWS.includes(view)){
      const st={sub:1,view,arg:arg??null};
      inSub?history.replaceState(st,''):history.pushState(st,'');
    }else if(view==='list'&&inSub){ S._toList=true; history.back(); return; } // 목록 버튼 = 뒤로 가기와 같게
    else history.replaceState({view},'');
  }
  S.view = view; S.arg = arg;
  $('#hBack').classList.toggle('hidden', view==='list' || view==='login');
  $('#hLogout').classList.toggle('hidden', view==='login');
  window.scrollTo(0,0);
  ({login:renderLogin, list:renderList, new:renderNew, review:renderReview, detail:renderDetail, edit:renderEdit})[view](arg);
}
function logout(ask=true){
  if (ask && !confirm('로그아웃할까요?')) return;
  S.token=''; localStorage.removeItem('mm_token'); go('login');
}

// v3.8: 일련번호 — 회의 날짜 오래된 순 1번부터(같은 날은 먼저 만든 것이 앞). 부서·검색으로 걸러도 번호는 그대로.
// DB에 저장하지 않고 목록을 불러올 때마다 매김 → 지운 회의록이 있으면 뒤 번호가 당겨짐.
function numberItems(){
  const key=d=>[d.date||'', d.createdAt||'', d.id].join('|');
  [...S.items].sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:0).forEach((d,i)=>{ d._no=i+1; });
}
function matches(d,q){
  if(!q) return true;
  const hay=[d.dept,d.title,d.date,d.place,d.recorder,d.summary,...(d.attendees||[]),...(d.keywords||[]),
    ...(d.speakers||[]).map(x=>x.text||x),...(d.topics||[]).flatMap(t=>[t.title,...(t.items||[])]),
    ...(d.proposals||[]).flatMap(x=>[x.item,x.action]),...(d.checks||[]),...(d.materials||[]).flatMap(t=>[t.title,t.source,...(t.items||[])])].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
// v3.1: 부서 고르기(이 기기에 기억). '' = 전체, '-' = 부서 미지정(옛 회의록)
let deptFilter=''; try{ deptFilter=localStorage.getItem('mm_dept_filter')||''; }catch(e){}
function setDept(k){ deptFilter=k; try{ localStorage.setItem('mm_dept_filter',k); }catch(e){} drawList(); }
function drawChips(){
  const el=$('#deptChips'); if(!el) return;
  const cnt=k=>S.items.filter(d=>(d.dept||'-')===k).length;
  const none=cnt('-');
  if(deptFilter && deptFilter!=='-' && !DEPTS.includes(deptFilter)) deptFilter='';
  if(deptFilter==='-' && !none) deptFilter='';
  const chip=(k,label,n)=>`<button class="chip${deptFilter===k?' on':''}" onclick="setDept('${k}')">${esc(label)}${n!==undefined?`<small>${n}</small>`:''}</button>`;
  el.innerHTML=chip('','전체',S.items.length)+DEPTS.map(x=>chip(x,x,cnt(x))).join('')+(none?chip('-','부서 미지정',none):'');
}
function drawList(){
  drawChips();
  const q=($('#q')||{}).value||'';
  const rows=S.items.filter(d=>(!deptFilter||(d.dept||'-')===deptFilter)&&matches(d,q));
  if(!rows.length){ $('#listBox').innerHTML=`<div class="empty">${!S.items.length?'아직 회의록이 없습니다. 새 회의록을 만들어보세요.':q?'검색 결과가 없습니다':'이 부서의 회의록이 없습니다'}</div>`; return; }
  $('#listBox').innerHTML = rows.map(d=>{
    if(d.isPrivate) return `<div class="list-item locked" onclick="go('detail','${d.id}')">
      <div class="t"><span class="no">${d._no}.</span>🔒 ${esc([d.dept||'부서 미지정', fmtDate(d.date)].join(' · '))}</div>
    </div>`;
    return `<div class="list-item" onclick="go('detail','${d.id}')">
      <div class="t"><span class="no">${d._no}.</span>${esc(d.title)}</div>
      <div class="m">${d.dept?`<span class="tag dept">${esc(d.dept)}</span> `:''}${fmtDate(d.date)}${d.place?' · '+esc(d.place):''}${d.recorder?' · 기록 '+esc(d.recorder):''}</div>
      ${d.summary?`<div class="s">${esc(d.summary)}</div>`:''}
      <div>${(d.topics||[]).length?`<span class="tag">주제 ${d.topics.length}</span>`:''}${(d.proposals||[]).length?`<span class="tag ok">제안 ${d.proposals.length}</span>`:''}${(d.checks||[]).length?`<span class="tag warn">확인 ${d.checks.length}</span>`:''}${(d.materials||[]).length?`<span class="tag">자료 ${d.materials.length}</span>`:''}</div>
    </div>`;
  }).join('');
}

  const rd=new FileReader(); rd.onload=()=>{ $('#fText').value=rd.result; toast('텍스트를 불러왔습니다'); }; rd.readAsText(f,'utf-8');

/* ───────── 자료 첨부 (v2.1: 사진 + PDF·PPTX·DOCX·HWPX) ─────────
   - 사진: 줄여서 JPEG로. AI가 이미지로 읽음
   - PDF: 그대로 보냄. AI가 문서로 읽음(그림·표 포함)
   - PPTX·DOCX·HWPX: 브라우저에서 글자만 뽑아 AI에 보냄(그림 속 글자는 못 읽음 → 필요하면 PDF로).
     원본 파일은 저장할 때 드라이브에 보관 */
const FILE_ACCEPT='image/*,.pdf,application/pdf,.pptx,.docx,.hwpx';
const MB=1024*1024, MAX_PDF=20*MB, MAX_KEEP=20*MB, MAX_TEXT=60000;
const DOC_MIME={pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',hwpx:'application/hwp+zip'};
const extOf=n=>(String(n).match(/\.([^.]+)$/)||['',''])[1].toLowerCase();
const KIND_LABEL=it=>it.kind==='pdf'?'PDF':it.kind==='doc'?({pptx:'PPT',docx:'Word',hwpx:'한글'}[extOf(it.name)]||'문서'):'';
async function addImages(inp){
  for (const f of inp.files){
    const ext=extOf(f.name);
    try{
      if(f.type.startsWith('image/')){
        const img = await shrinkImage(f, 1600, 0.82);
        S.images.push({name:f.name.replace(/\.[^.]+$/,'')+'.jpg', kind:'image', mime:'image/jpeg', data:img.base64, preview:img.dataUrl, type:'handout'});
      }else if(ext==='pdf'){
        if(f.size>MAX_PDF){ toast(`${f.name}: PDF가 ${Math.round(f.size/MB)}MB입니다. 20MB 이하로 줄이거나 나눠서 올려주세요`); continue; }
        S.images.push({name:f.name, kind:'pdf', mime:'application/pdf', data:await fileB64(f), size:f.size, type:'handout'});
      }else if(DOC_MIME[ext]){
        const buf=await f.arrayBuffer();
        let text=ext==='pptx'?await pptxText(buf):ext==='docx'?await docxText(buf):await hwpxText(buf);
        if(text.length>MAX_TEXT) text=text.slice(0,MAX_TEXT)+'\n…(이후 생략)';
        // 원본이 너무 크면(그림 많은 PPT 등) 글자만 남기고 원본 보관은 생략
        const keep=f.size<=MAX_KEEP;
        S.images.push({name:f.name, kind:'doc', mime:DOC_MIME[ext], data:keep?await fileB64(f):'', size:f.size, extractedText:text, type:'handout'});
        if(text.replace(/\s|\[슬라이드 \d+\]/g,'').length<30) toast(`${f.name}: 글자가 거의 없습니다(그림 위주?). PDF로 저장해 올리면 그림 속 글자까지 읽습니다`);
        else if(!keep) toast(`${f.name}: 파일이 커서 원본은 보관하지 않고 글자만 정리합니다`);
      }else if(['ppt','doc','hwp'].includes(ext)){
        toast(`${f.name}: 옛 형식은 읽지 못합니다. PDF로 저장해 올려주세요`);
      }else toast(`${f.name}: 지원하지 않는 형식입니다`);
    }catch(e){ toast('자료 처리 실패: '+f.name+' ('+e.message+')'); }
  }
  inp.value=''; drawThumbs();
}
function fileB64(f){ return new Promise((res,rej)=>{ const rd=new FileReader(); rd.onload=()=>res(String(rd.result).split(',')[1]||''); rd.onerror=rej; rd.readAsDataURL(f); }); }
// 첨부 칸 하나(새 회의록·수정·확인 화면 공용)
function fileBox(name,label){ return `<div class="file"><b>${esc(label)}</b>${esc(name)}</div>`; }
function drawThumbs(){
  $('#thumbs').innerHTML = S.images.map((im,i)=>`
    <div class="thumb">${im.kind==='image'?`<img src="${im.preview}" alt="">`:fileBox(im.name,KIND_LABEL(im))}
      <button class="x" onclick="S.images.splice(${i},1);drawThumbs()">×</button>
      <select onchange="S.images[${i}].type=this.value">
        <option value="handout" ${im.type==='handout'?'selected':''}>${im.kind==='image'?'유인물(텍스트화)':'AI 정리'}</option>
        <option value="photo" ${im.type==='photo'?'selected':''}>${im.kind==='image'?'자료 사진(보관만)':'보관만'}</option>
      </select></div>`).join('');
}

/* ── zip 풀기(라이브러리 없이, 브라우저 내장 DecompressionStream) ── */
async function unzip(buf, want){
  const u8=new Uint8Array(buf), dv=new DataView(buf), dec=new TextDecoder();
  let e=u8.length-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('파일 형식이 올바르지 않습니다');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+xl+cl;
    if(!want(name)) continue;
    const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true), data=u8.subarray(st,st+csize);
    let raw;
    if(method===0) raw=data;
    else if(method===8){
      if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 파일 풀기를 지원하지 않습니다. PDF로 올려주세요');
      raw=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else continue;
    out[name]=dec.decode(raw);
  }
  return out;
}
const xmlDoc=t=>new DOMParser().parseFromString(t||'<x/>','application/xml');
const tags=(node,local)=>[...node.getElementsByTagNameNS('*',local)];
const up=(node,local)=>{ let x=node.parentNode; while(x&&x.localName!==local) x=x.parentNode; return x; };
// 문단(pName) 단위로 글자(tName)를 모음. 표 안 문단은 skip 집합으로 뺄 수 있음
function paraLines(root,pName,tName,skip){
  return tags(root,pName).filter(p=>!(skip&&skip.has(p))).map(p=>tags(p,tName).filter(t=>up(t,pName)===p).map(t=>t.textContent).join('').trim()).filter(Boolean);
}
// 표: 행마다 칸을 " | "로 이음
function tableLines(root,tbl,tr,tc,pName,tName,skip){
  const lines=[];
  for(const tb of tags(root,tbl)){
    if(up(tb,tbl)) continue; // 표 안의 표는 바깥 표에서 처리
    for(const r of tags(tb,tr).filter(r=>up(r,tbl)===tb)){
      const cells=tags(r,tc).filter(c=>up(c,tr)===r).map(c=>{ const ps=tags(c,pName); ps.forEach(x=>skip.add(x)); return ps.map(x=>tags(x,tName).filter(t=>up(t,pName)===x).map(t=>t.textContent).join('')).join(' ').trim(); });
      if(cells.some(Boolean)) lines.push('| '+cells.join(' | ')+' |');
    }
  }
  return lines;
}
async function pptxText(buf){
  const f=await unzip(buf, n=>/^ppt\/(slides|notesSlides)\/(_rels\/)?[^/]+\.xml(\.rels)?$/.test(n)||n==='ppt/presentation.xml'||n==='ppt/_rels/presentation.xml.rels');
  const num=s=>+(s.match(/(\d+)\.xml$/)||[0,0])[1];
  let order=[];
  try{ // 실제 슬라이드 순서(presentation.xml) — 순서를 바꾼 발표 자료 대비
    const map={}; for(const r of tags(xmlDoc(f['ppt/_rels/presentation.xml.rels']),'Relationship')) map[r.getAttribute('Id')]=r.getAttribute('Target');
    for(const sd of tags(xmlDoc(f['ppt/presentation.xml']),'sldId')){
      const t=map[sd.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')];
      if(t) order.push(t.startsWith('/')?t.slice(1):'ppt/'+t.replace(/^\.\//,''));
    }
  }catch(e){}
  order=order.filter(n=>f[n]);
  if(!order.length) order=Object.keys(f).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b));
  return order.map((name,i)=>{
    const d=xmlDoc(f[name]), skip=new Set();
    const lines=[...tableLines(d,'tbl','tr','tc','p','t',skip)];
    lines.unshift(...paraLines(d,'p','t',skip));
    // 발표자 메모(본문 칸만)
    const rel=f[name.replace(/slides\/(slide\d+\.xml)$/,'slides/_rels/$1.rels')];
    const nt=rel&&(rel.match(/notesSlides\/(notesSlide\d+\.xml)/)||[])[1];
    if(nt&&f['ppt/notesSlides/'+nt]){
      const nd=xmlDoc(f['ppt/notesSlides/'+nt]);
      const memo=tags(nd,'sp').filter(sp=>(tags(sp,'ph')[0]||{getAttribute:()=>null}).getAttribute('type')==='body').flatMap(sp=>paraLines(sp,'p','t'));
      if(memo.length) lines.push('(발표자 메모) '+memo.join(' / '));
    }
    return `[슬라이드 ${i+1}]\n`+lines.join('\n');
  }).join('\n\n');
}
async function docxText(buf){
  const f=await unzip(buf, n=>n==='word/document.xml');
  const d=xmlDoc(f['word/document.xml']), body=tags(d,'body')[0]||d, out=[];
  for(const el of body.children){
    if(el.localName==='p'){ const t=tags(el,'t').filter(x=>up(x,'p')===el).map(x=>x.textContent).join('').trim(); if(t) out.push(t); }
    else if(el.localName==='tbl'){ const tmp=document.implementation.createDocument(null,'r'); tmp.documentElement.appendChild(tmp.importNode(el,true)); out.push(...tableLines(tmp,'tbl','tr','tc','p','t',new Set())); }
    else out.push(...paraLines(el,'p','t'));
  }
  return out.join('\n');
}
async function hwpxText(buf){
  const f=await unzip(buf, n=>/^Contents\/section\d+\.xml$/.test(n));
  const names=Object.keys(f).sort((a,b)=>+a.match(/(\d+)\.xml$/)[1]-+b.match(/(\d+)\.xml$/)[1]);
  return names.map(n=>{ const d=xmlDoc(f[n]), skip=new Set(); const tb=tableLines(d,'tbl','tr','tc','p','t',skip); return [...paraLines(d,'p','t',skip),...tb].join('\n'); }).join('\n');
}
function shrinkImage(file, maxSide, quality){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      const r=Math.min(1, maxSide/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl=c.toDataURL('image/jpeg',quality);
      URL.revokeObjectURL(url);
      res({dataUrl, base64:dataUrl.split(',')[1]});
    };
    img.onerror=rej; img.src=url;
  });
}

    const hand=S.images.filter(i=>i.type==='handout');

    S.draft = {

      date: meta.date || a.date || today(), place: meta.place || a.place || '',
      attendees: meta.attendees.length? meta.attendees : (a.attendees||[]), recorder: meta.recorder,

      summary:a.summary||'', keywords:a.keywords||[], related:[], rawText:text,

const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=_crcT[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true);
    ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const xe=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wRun(text,o={}){
  const pr=(o.b?'<w:b/>':'')+(o.color?`<w:color w:val="${o.color}"/>`:'')+(o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:'');
  const body=String(text??'').split(/\r?\n/).map(t=>`<w:t xml:space="preserve">${xe(t)}</w:t>`).join('<w:br/>');
  return `<w:r>${pr?`<w:rPr>${pr}</w:rPr>`:''}${body}</w:r>`;
}
function wPara(runs,o={}){
  const pr=(o.keepNext?'<w:keepNext/>':'')+(o.bullet?'<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>':'')
    +(o.border?'<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="6" w:color="BBBBBB"/></w:pBdr>':o.topBorder?'<w:pBdr><w:top w:val="single" w:sz="6" w:space="6" w:color="BBBBBB"/></w:pBdr>':'')
    +(o.bar?`<w:pBdr><w:left w:val="single" w:sz="36" w:space="6" w:color="${o.bar[0]}"/></w:pBdr><w:shd w:val="clear" w:color="auto" w:fill="${o.bar[1]}"/>`:'')
    +`<w:spacing w:before="${o.before||0}" w:after="${o.after??80}"/>`+(o.jc?`<w:jc w:val="${o.jc}"/>`:'');
  return `<w:p><w:pPr>${pr}</w:pPr>${runs}</w:p>`;
}
function buildDocxBlob(d, relDocs, o={}){

  const BLUE='2F5A8B', TOPIC='3A74B0';
  const H1=(t)=>wPara(wRun(t,{b:1,sz:28,color:BLUE}),{before:320,after:120,keepNext:1});
  const bl=t=>wPara(wRun(t),{bullet:1,after:60});
  const bord=['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('');
  const cell=(w,inner,fill)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:''}</w:tcPr>${inner}</w:tc>`;
  const table=(widths,head,rows)=>`<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblBorders>${bord}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`
    +`<w:tr><w:trPr><w:tblHeader/></w:trPr>${head.map((h,i)=>cell(widths[i],wPara(wRun(h,{b:1}),{after:0}),'DCE6F1')).join('')}</w:tr>`
    +rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c,i)=>cell(widths[i],c.x,c.fill)).join('')}</w:tr>`).join('')+`</w:tbl>`;
  const sub=[d.dept, fmtDate(d.date), d.place, (d.attendees||[]).length?'참석 '+d.attendees.join(', '):'', d.recorder?'기록 '+d.recorder:''].filter(Boolean).join(' · ');
  // v2.2: o.keys(넣을 본문 칸)·o.intro·o.related·o.attach로 칸을 고름. 뺀 칸이 있으면 번호를 1부터 다시 매김
  const keys=(o.keys||Object.keys(SEC)).filter(k=>(d[k]||[]).length);
  const HS=k=>H1(`${keys.indexOf(k)+1}. ${secName(k)}`);
  const spCellX=t=>{ const l=spLines(t); return l.length>1?l.map((v,i)=>wPara(wRun(v),{bullet:1,after:i===l.length-1?0:40})).join(''):wPara(wRun(l[0]||''),{after:0}); };
  const part={
    speakers:()=>HS('speakers')+table([1500,8138],['발언자','발언 내용'],d.speakers.map(v=>[{x:wPara(wRun(v.speaker,{b:1}),{after:0}),fill:'F3F2EE'},{x:spCellX(v.text)}])),
    topics:()=>HS('topics')+d.topics.map((t,i)=>wPara(wRun(`${circ(i)} ${t.title}`,{b:1,sz:24,color:TOPIC}),{before:200,after:80,keepNext:1})+t.items.map(bl).join('')).join(''),
    proposals:()=>HS('proposals')+table([700,2800,6138],['No.','항목','실행 내용'],d.proposals.map((v,i)=>[{x:wPara(wRun(String(i+1),{b:1}),{after:0,jc:'center'})},{x:wPara(wRun(v.item,{b:1}),{after:0})},{x:wPara(wRun(v.action),{after:0})}])),
    checks:()=>HS('checks')+wPara(wRun('아래 항목은 음성 변환 판독이 불확실하여 추정으로 기재한 부분입니다. 확인 후 수정이 필요합니다.',{sz:20,color:'444444'}),{after:80})+d.checks.map(bl).join(''),
    materials:()=>HS('materials')+d.materials.map((t,i)=>wPara(wRun(`${circ(i)} ${t.title}`,{b:1,sz:24,color:TOPIC})+(t.source?wRun(`  (${t.source})`,{sz:18,color:'888888'}):''),{before:200,after:80,keepNext:1})+t.items.map(bl).join('')).join(''),
  };
  const body=
    wPara(wRun(d.title||'회의록',{b:1,sz:40,color:BLUE}),{jc:'center',before:200,after:80})+
    wPara(wRun(sub,{sz:20,color:'666666'}),{jc:'center',after:200,border:1})+
    (o.intro!==false? wPara(wRun(introText(d,keys)+(d.summary?'\n'+d.summary:''),{sz:20,color:'444444'}),{before:160,after:120}):'')+
    keys.map(k=>part[k]()).join('')+
    (o.related!==false&&(relDocs||[]).length? H1('관련 회의록')+relDocs.map(x=>bl(`${x.title} (${fmtDate(x.date)})`)).join(''):'')+
    (o.attach!==false&&(d.attachments||[]).length? H1('첨부 자료')+d.attachments.map(a=>bl(`${a.name} (${(a.kind&&a.kind!=='image')?KIND_LABEL(a):a.type==='handout'?'유인물':'사진'})`)).join(''):'')+
    wPara(wRun(`작성일: ${fmtDate(today())}`,{sz:18,color:'888888'}),{before:360,jc:'right',border:0,topBorder:1});
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return makeZip([
    {name:'[Content_Types].xml',text:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>'},
    {name:'_rels/.rels',text:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>'},
    {name:'word/_rels/document.xml.rels',text:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>'},
    {name:'word/styles.xml',text:H+`<w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="맑은 고딕" w:hAnsi="맑은 고딕" w:eastAsia="맑은 고딕" w:cs="맑은 고딕"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="ko-KR" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="320" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`},
    {name:'word/numbering.xml',text:H+`<w:numbering ${NS}><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="400" w:hanging="260"/></w:pPr><w:rPr><w:rFonts w:ascii="맑은 고딕" w:hAnsi="맑은 고딕" w:eastAsia="맑은 고딕"/></w:rPr></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>`},
    {name:'docProps/core.xml',text:H+`<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xe(d.title||'회의록')}</dc:title><dc:creator>${xe(d.recorder||'높은뜻안성교회')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:created></cp:coreProperties>`},
    {name:'docProps/app.xml',text:H+'<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Microsoft Office Word</Application></Properties>'},
    {name:'word/document.xml',text:H+`<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`}
  ]);

/* v2.4: 상세 화면 항목 앞 체크 → 체크한 것만 Word로 (v2.2의 칸 선택 창을 대신함)
   - 칸 제목 체크 = 그 칸 전체 켜기/끄기. 칸 전체를 끈 것은 이 기기에 기억(다음 회의록에도)
   - 개별 항목 체크는 기억하지 않음(회의록마다 다름). 화면을 다시 열면 칸 설정대로 돌아감 */
function xsMark(el,on){ const c=el.closest('.xi'); if(c) c.classList.toggle('off',!on); }
function xsSync(k){
  const sec=document.querySelector(`.xsec[data-k="${k}"]`); if(!sec) return;
  const items=[...document.querySelectorAll(`.xs[data-k="${k}"]`)]; if(!items.length){ xsMark(sec,sec.checked); return; }
  const n=items.filter(x=>x.checked).length;
  sec.checked=n>0; sec.indeterminate=n>0&&n<items.length;
}
function xsSec(el){
  const k=el.dataset.k, items=[...document.querySelectorAll(`.xs[data-k="${k}"]`)];
  items.forEach(x=>{ x.checked=el.checked; xsMark(x,el.checked); });
  if(!items.length) xsMark(el,el.checked);
  el.indeterminate=false;
}
function xsItem(el){ xsMark(el,el.checked); xsSync(el.dataset.k); }
function xsAll(on){ document.querySelectorAll('.xsec').forEach(x=>{ x.checked=on; xsSec(x); }); }
// v2.9: 체크한 항목 고르기 — Word 저장과 인쇄/PDF가 같이 씀
function checkedDoc(){
  const d=S.current; if(!d) return null;
  const secOn=k=>{ const x=document.querySelector(`.xsec[data-k="${k}"]`); return !!x&&x.checked; };
  const pick=k=>(d[k]||[]).filter((_,i)=>{ const x=document.querySelector(`.xs[data-k="${k}"][data-i="${i}"]`); return x&&x.checked; });
  const keys=Object.keys(SEC).filter(k=>secOn(k));
  const d2=Object.assign({},d); Object.keys(SEC).forEach(k=>{ d2[k]=keys.includes(k)?pick(k):[]; });
  const used=keys.filter(k=>d2[k].length);
  const o={keys:used, intro:secOn('intro'), related:false, attach:secOn('attach')};
  if(!used.length && !o.intro){ toast('체크한 항목이 없습니다'); return null; }
  // 칸 전체를 끈 것만 기억(일부만 고른 칸은 켜진 것으로 봄)
  const offList=[...document.querySelectorAll('.xsec')].filter(x=>!x.checked).map(x=>x.dataset.k);
  try{ localStorage.setItem('mm_docx_off',JSON.stringify(offList)); }catch(e){}
  return {o,d2};
}
function exportDocxChecked(){ const c=checkedDoc(); if(c) exportDocx(c.o, c.d2); }
// v2.9: 인쇄/PDF — buildDocxBlob과 같은 구성·색·표를 HTML로 그려 그것만 인쇄
function buildPrintHtml(d, o={}){
  normDoc(d);
  const sub=[d.dept, fmtDate(d.date), d.place, (d.attendees||[]).length?'참석 '+d.attendees.join(', '):'', d.recorder?'기록 '+d.recorder:''].filter(Boolean).join(' · ');
  const keys=(o.keys||Object.keys(SEC)).filter(k=>(d[k]||[]).length);
  const HS=k=>`<h2>${keys.indexOf(k)+1}. ${esc(secName(k))}</h2>`;
  const ul=a=>`<ul>${a.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`;
  const spC=t=>{ const l=spLines(t); return l.length>1?ul(l):esc(l[0]||''); };
  const part={
    speakers:()=>HS('speakers')+`<table><colgroup><col style="width:15.6%"><col></colgroup><thead><tr><th>발언자</th><th>발언 내용</th></tr></thead><tbody>${d.speakers.map(v=>`<tr><td class="k">${esc(v.speaker)}</td><td>${spC(v.text)}</td></tr>`).join('')}</tbody></table>`,
    topics:()=>HS('topics')+d.topics.map((t,i)=>`<h3>${circ(i)} ${esc(t.title)}</h3>${ul(t.items)}`).join(''),
    proposals:()=>HS('proposals')+`<table><colgroup><col style="width:7.3%"><col style="width:29%"><col></colgroup><thead><tr><th>No.</th><th>항목</th><th>실행 내용</th></tr></thead><tbody>${d.proposals.map((v,i)=>`<tr><td style="text-align:center;font-weight:700">${i+1}</td><td style="font-weight:700">${esc(v.item)}</td><td>${esc(v.action)}</td></tr>`).join('')}</tbody></table>`,
    checks:()=>HS('checks')+`<p class="note">아래 항목은 음성 변환 판독이 불확실하여 추정으로 기재한 부분입니다. 확인 후 수정이 필요합니다.</p>`+ul(d.checks),
    materials:()=>HS('materials')+d.materials.map((t,i)=>`<h3>${circ(i)} ${esc(t.title)}${t.source?` <small>(${esc(t.source)})</small>`:''}</h3>${ul(t.items)}`).join(''),
  };
  return `<div class="pd"><h1>${esc(d.title||'회의록')}</h1><div class="sub">${esc(sub)}</div>`
    +(o.intro!==false?`<div class="intro">${esc(introText(d,keys)+(d.summary?'\n'+d.summary:''))}</div>`:'')
    +keys.map(k=>part[k]()).join('')
    +(o.attach!==false&&(d.attachments||[]).length?`<h2>첨부 자료</h2>`+ul(d.attachments.map(a=>`${a.name} (${(a.kind&&a.kind!=='image')?KIND_LABEL(a):a.type==='handout'?'유인물':'사진'})`)):'')
    +`<div class="foot">작성일: ${esc(fmtDate(today()))}</div></div>`;
}
function printChecked(){
  const c=checkedDoc(); if(!c) return;
  let el=document.getElementById('printDoc');
  if(!el){ el=document.createElement('div'); el.id='printDoc'; document.body.appendChild(el); }
  el.innerHTML=buildPrintHtml(c.d2, c.o);
  const t0=document.title; document.title=`회의록_${c.d2.date||today()}_${(c.d2.title||'').slice(0,40)}`; // PDF 저장 파일 이름
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing'); document.title=t0; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),50); // 폰 크롬은 print()가 바로 돌아오므로 정리는 afterprint에서만
}
async function exportDocx(o={}, dOverride){
  const d=dOverride||S.current; if(!d) return;
  try{
    const blob=buildDocxBlob(d, [], o);
    const safe=(d.title||'회의록').replace(/[\\/:*?"<>|\r\n]+/g,' ').trim().slice(0,40);
    const fname=`회의록_${d.date||today()}_${safe}.docx`;
    // 폰: 브라우저 다운로드는 앱(카톡 등) 안 브라우저나 문서 앱 연결 문제로 '지원하지 않는 파일'이 뜨기 쉬워
    //     공유 창으로 Word·한컴·카카오톡·드라이브에 바로 넘긴다. PC는 그대로 다운로드.
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(mobile && navigator.canShare){
      const file=new File([blob],fname,{type:blob.type});
      if(navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:fname}); return; }
        catch(e){ if(e.name==='AbortError') return; /* 공유 실패 → 다운로드로 */ }
      }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Word 파일을 저장했습니다');
  }catch(e){ toast('저장 실패: '+e.message); }
}

async function renderEdit(id){
  $('#hTitle').textContent='회의록 수정';
  const d = S.current && S.current.id===id ? S.current : (await api('get',{id, docPass:S.pass[id]||''})).item;
  S.draft = normDoc(JSON.parse(JSON.stringify(d))); S.images=[];
  S.draft._pass = S.pass[id]||'';
  $('#app').innerHTML = `
  ${formHtml(S.draft, [], [], true)}
  <div class="card" id="attCard"></div>
  <div class="actions">
    <button class="btn" onclick="go('detail','${id}')">취소</button>
    <button class="btn primary" style="flex:1" onclick="saveEdit('${id}')">저장</button>
  </div>`;
  drawAttEdit();
}
// v2.6: 「5. 첨부 자료 내용」 안에서 파일 첨부 → 저장하면 채록문+모든 첨부(AI 정리)로 1~5단을 다시 정리
function matUploadHtml(){
  return `<div class="mat-up" style="margin:10px 0 4px;padding:10px;border:1px dashed var(--line,#ccc);border-radius:10px">
    <label style="margin-top:0">자료 파일 첨부 (사진·PDF·PPTX·DOCX·HWPX)</label>
    <input type="file" id="fImg" accept="${FILE_ACCEPT}" multiple onchange="addImages(this)">
    <div class="thumbs" id="thumbs"></div>
    <p class="muted" style="margin:6px 0 8px">새 파일을 넣고 「저장」하면, 채록문과 첨부 자료(「AI 정리」로 둔 것) 전체를 AI가 읽어 회의록 1~5를 다시 정리합니다. 파일 없이 다시 정리하려면 아래 버튼을 누르세요.</p>
    <button class="btn" style="padding:6px 12px;font-size:13px" onclick="saveEdit(S.draft.id,true)">첨부 자료 포함해 AI로 다시 정리</button>
  </div>`;
}
// v2.3: 이미 저장된 첨부를 수정 화면에서 빼기(저장해야 반영, 드라이브 원본은 휴지통으로)
function drawAttEdit(){
  const list=S.draft.attachments||[], el=$('#attCard'); if(!el) return;
  el.innerHTML=`<h2>저장된 첨부 ${list.length}건</h2>`+(list.length?`<p class="muted" style="margin:0 0 8px">× 를 누른 뒤 아래 「저장」을 눌러야 지워집니다. 드라이브 원본은 휴지통으로 갑니다(30일 안에 복구 가능).</p><div class="thumbs">${list.map((a,i)=>{
    const img=!a.kind||a.kind==='image';
    return `<div class="thumb">${img?`<img src="${a.thumb}" alt="${esc(a.name)}" loading="lazy">`:fileBox(a.name,KIND_LABEL(a))}<span class="k">${img?(a.type==='handout'?'유인물':'사진'):KIND_LABEL(a)}</span><button class="x" onclick="S.draft.attachments.splice(${i},1);drawAttEdit()">×</button></div>`;
  }).join('')}</div>`:'<p class="muted" style="margin:0">첨부가 없습니다.</p>');
}
async function saveEdit(id, forceRe){
  const d=collectForm(S.draft);
  if(!d.dept){ toast('부서를 골라주세요'); $('#eDept').focus(); return; }
  if(d.isPrivate && !d._pass && !confirm('비밀번호 칸이 비어 있어 이 회의록이 「공개」로 바뀝니다. 계속할까요?')) return;
  const newAi=S.images.some(i=>i.type==='handout');
  const re=forceRe||newAi;
  if(re && !confirm('채록문과 첨부 자료를 AI가 다시 읽어 회의록 1~5(개인별 발언·주제별·종합 제안·확인 필요·첨부 자료 내용)를 새로 정리합니다.\n직접 고친 내용은 새 정리로 바뀝니다(바로 전 내용은 서버에 한 벌 남겨 둡니다).\n1~3분 걸립니다. 진행할까요?')) return;
  try{
    busy(true,'저장 중…');
    const images=S.images.map(i=>({name:i.name,kind:i.kind,mime:i.mime,data:i.data,type:i.type,extractedText:i.extractedText||''}));
    const payload={dept:d.dept,title:d.title,date:d.date,place:d.place,attendees:d.attendees,recorder:d.recorder,speakers:d.speakers,topics:d.topics,proposals:d.proposals,checks:d.checks,materials:d.materials,summary:d.summary,keywords:d.keywords,related:d.related,attachments:d.attachments||[]};
    await api('update',{id, doc:payload, images, docPass:S.pass[id]||'', newPass:d._pass||''});
    if(d._pass) S.pass[id]=d._pass; else delete S.pass[id];
    S.images=[];
    if(re){
      busy(true,'AI가 첨부 자료까지 포함해 회의록을 다시 정리하고 있습니다… (1~3분)');
      const r=await api('reanalyze',{id, docPass:S.pass[id]||''}); S.current=normDoc(r.item);
      toast('첨부 자료까지 반영해 다시 정리했습니다');
    } else toast('수정했습니다');
    const r=await api('list',{limit:300}); S.items=r.items||[];
    go('detail',id);
  }catch(e){ toast(e.message); } finally{ busy(false); }
}

window.addEventListener('popstate', e=>{
  const st=e.state||{};
  if(st.sub){ // 앞으로 가기로 다시 들어온 경우
    if(st.view==='review'&&!S.draft) { history.back(); return; }
    go(st.view, st.arg, true); return;
  }
  const toList=S._toList; S._toList=false;
  // 쓰던 내용이 있는 화면에서 뒤로 가기 → 한 번 묻고, 취소하면 그 화면에 머문다
  if(!toList && ['new','review','edit'].includes(S.view) && !confirm('작성 중인 내용은 저장되지 않습니다. 목록으로 갈까요?')){
    history.pushState({sub:1,view:S.view,arg:S.arg??null},''); return;
  }
  if($('#overlay').classList.contains('on')) busy(false);
  go(S.token?'list':'login', null, true);
});

/* ───────── 시작 ───────── */
go(S.token ? 'list' : 'login');
</script>
</body>
</html>
